name: Build Tavrynexo fixify EXE & MSIX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore WinRescuePro.csproj

      - name: Publish Standalone Single-File EXE
        run: >
          dotnet publish WinRescuePro.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o ./release-exe

      - name: Publish and Pack MSIX for Microsoft Store
        shell: pwsh
        run: |
          dotnet publish WinRescuePro.csproj -c Release -r win-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false -o ./msix-staging
          Copy-Item Packaging/AppxManifest.xml ./msix-staging/AppxManifest.xml -Force
          New-Item -ItemType Directory -Force -Path ./msix-staging/Assets | Out-Null
          Copy-Item Packaging/StoreAssets/*.png ./msix-staging/Assets/ -Force
          New-Item -ItemType Directory -Force -Path ./release-msix | Out-Null
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $makeappx) { throw "makeappx.exe not found" }
          & $makeappx pack /d ./msix-staging /p ./release-msix/TavrynexoFixify_1.0.0.0_x64.msix /o

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TavrynexoFixify-win-x64-exe
          path: ./release-exe/TavrynexoFixify.exe
          if-no-files-found: error

      - name: Upload MSIX Store Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TavrynexoFixify-win-x64-msix
          path: ./release-msix/TavrynexoFixify_1.0.0.0_x64.msix
          if-no-files-found: error
